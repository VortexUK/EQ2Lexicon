[build]
builder = "nixpacks"
# Only redeploy when something that ships in the image changes. Railway reads
# `watchPatterns` here under [build] — a `watchPaths` key under [deploy] is
# silently ignored, which is why dashboard/doc commits used to redeploy.
# gitignore-style, matched from the repo root; negations need a preceding
# include (`**`).
watchPatterns = ["**", "!/ops/**", "!/docs/**", "!/.github/**", "!/.claude/**", "!/*.md"]

[deploy]
# Start sequence (post-Phase-2: every data family lives in Supabase
# Postgres — DATABASE_URL; the only SQLite left is committed reference
# data shipped in the repo image, so there is no volume setup at all):
#   Exec the app. Schema migrations run inside the app lifespan
#   (backend/pg_migrate.py) — a deploy IS a migration run.
#
# Python binary discovery (2026-05-27): we MUST use the project's venv
# (`/app/.venv/bin/python`) — that's where `uv sync` installed the
# project's dependencies. The `python` on PATH is the bare Nix-store
# Python from /root/.nix-profile/bin which has no site-packages, so
# resolving via `command -v python` would land us there and crash with
# `ModuleNotFoundError: No module named 'dotenv'` on first import.
#
# Discovery order: try the known venv paths first (`/app/.venv` then a
# legacy `/opt/venv` fallback), then PATH as a last resort. A diagnostic
# dump of every candidate runs unconditionally so any future Nixpacks
# layout change is visible in the first 10 log lines without another
# round-trip through build logs.
startCommand = "set -x; echo '=== python path discovery ==='; (which python python3 2>&1 || true); (ls -la /app/.venv/bin/ 2>&1 | head -20 || true); (ls -la /opt/venv/bin/ 2>&1 | head -20 || true); echo \"PATH=$PATH\"; echo '=== end discovery ==='; PYTHON_BIN=''; for c in /app/.venv/bin/python /opt/venv/bin/python; do if [ -x \"$c\" ]; then PYTHON_BIN=\"$c\"; break; fi; done; if [ -z \"$PYTHON_BIN\" ]; then PYTHON_BIN=$(command -v python || command -v python3 || echo ''); fi; if [ -z \"$PYTHON_BIN\" ]; then echo 'FATAL: no python found in project venv or on PATH' >&2; exit 78; fi; echo \"Resolved Python: $PYTHON_BIN\"; exec \"$PYTHON_BIN\" main.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Don't route traffic (or call the deploy live) until the app actually
# serves — without this Railway switches the edge to the new container the
# moment it starts, while python imports + lifespan (pool open + pending
# migrations) are still running, and every request 502s through
# Cloudflare. NOTE: with an attached volume Railway still deploys WITH
# downtime (the volume can only mount one container), so the goal is a
# window of a few seconds: fast old-process exit (see main.py signal
# handling) + gated cutover here.
healthcheckPath = "/api/health"
healthcheckTimeout = 300
